# GROUP C - adjudication of product codes LLZ and JAK (Radiology/Pathology panel rows only).
#
# 261 devices: LLZ 160 ("System, Image Processing, Radiological", 892.2050) and JAK 101
# ("System, X-Ray, Tomography, Computed", 892.1750). openFDA returns an EMPTY "definition"
# string for both codes, verified in data/raw/2026-03-30/classification_001.json, so the code
# carries no signal whatsoever and every call below rests on the device itself. Approach: read
# each device name and company, identify the commercial product where I know it (marked "Known
# product:" in the evidence, per the brief), and apply the brief's borderline rules mechanically
# and consistently - breast density is not_oncology; emphysema/COPD lung density is
# not_oncology; reconstruction, denoising, enhancement, acquisition, positioning and dose
# reduction are not_oncology even on cancer-capable hardware; PACS and viewers are
# not_oncology; organ segmentation with no stated neoplastic target and multi-application
# vendor platforms whose module list is not stated are unresolved. JAK is dominated by CT
# scanners, deep-learning reconstruction and coronary calcium scoring; LLZ is a catch-all
# holding brain volumetry, cardiac, stroke, dental and orthopedic tools alongside the genuine
# oncology products. Result: 28 oncology (25 radiology_cancer_detection, 3
# radiology_radiation_therapy), 202 not_oncology, 31 unresolved. The unresolved 12% is
# concentrated in unnamed vendor platforms (syngo, Xeleris, Ziostation2, Synapse 3D, AVIEW
# base, uOmnispace.MI, TruSPECT) and in three of the historically important pre-2016 rows.
