# Adjudication fragment for product code QIH ("Automated Radiological Image Processing
# Software", 21 CFR 892.2050), the largest indeterminate bucket in
# config/oncology_codes.yaml. All 274 QIH rows in the 2026-03-30 snapshot carry
# Panel (Lead) = Radiology (none are Pathology), so this fragment covers the whole code.
# Approach: the 274 rows were first grouped by company and by name pattern, then adjudicated
# one at a time. QIH is a horizontal "post-processing software" code created in 2019, and its
# residents are dominated by cardiac echo/CT quantification, neuro volumetry, musculoskeletal
# and spine planning, dental imaging, and vendor viewing/post-processing platforms. Devices
# were called `oncology` only where the name states a neoplastic target (RECIST, HGlio, Brain
# Mets, TumorSight, Lymphoma) or where a specific commercial product with a stated neoplastic
# indication is identifiable (AmCAD-UT, MEDO-Thyroid, Medihub Prostate, AI-Rad Companion
# Prostate MR, qCT LN Quant, breastscape, LungVision, Voxel Dosimetry, DrAid for Liver
# Segmentation). Per the brief, breast density products (Saige-Density, PowerLook Density,
# Transpara Density, MammoScreen BD, Visage Breast Density, WRDensity, AutoDensity) are
# not_oncology, as are reconstruction/denoising, acquisition, positioning and PACS/viewer
# infrastructure. Multi-application vendor platforms whose module list mixes oncologic and
# non-oncologic apps (Arterys MICA, AVIEW unsuffixed, uAI Portal, syngo.via MI Workflows
# bundles, InferOperate Suite) and general 3D surgical-planning segmentation (Ceevra, IRISeg,
# Axial3D, Brainlab Elements, 3D-Side) are `unresolved` rather than guessed. QIH's earliest
# entry is 2019, so this code contributes nothing to the pre-2016 correction.
# Counts: 16 oncology (15 radiology_cancer_detection,
# 1 radiology_radiation_therapy), 216 not_oncology,
# 42 unresolved, of 274 rows.
