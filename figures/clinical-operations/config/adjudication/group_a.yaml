  # ---------------------------------------------------------------- QTZ
  - submission_number: K223639
    device: "VisAble.IO"
    company: "TechsoMed"
    product_code: QTZ
    year: 2023
    decision: oncology
    category: radiology_radiation_therapy
    confidence: high
    evidence: >-
      RESOLVED: TUMOUR ablation, not cardiac. Techsomed (Israel) is a liver-tumour ablation
      company. VisAble.IO received 510(k) clearance in 2023 as software to assist physicians in
      PLANNING LIVER ABLATION procedures and confirming the ablation zone, released as the first
      component of Techsomed's BioTrace solution for image-guided ablation therapy. BioTraceIO
      received FDA De Novo clearance (announced January 2024) as "the first ultrasound-based
      software for tissue response prediction in LIVER TUMOR ablation", validated in a 50-patient
      multicentre study against 24-hour contrast-enhanced CT; the supporting trial is NCT05582018,
      "Safety and Effectiveness of BioTraceIO 360 for Planning, Monitoring and Assessment of Liver
      Tissue Ablation Procedures". Product code QTZ (892.2050) is "Radiological Image Processing
      Software For Ablation Therapy Planning And Evaluation"; all three rows are the same
      Techsomed liver-tumour product line. CATEGORY NOTE: this is cancer treatment planning but it
      is thermal ablation, not radiotherapy. Assigned to radiology_radiation_therapy as the only
      treatment-planning category available; see my report - the scheme has no interventional-
      oncology slot. Row: VisAble.IO, TechsoMed, K223639 (2023).
