  - submission_number: DEN170073
    device: "ContaCT"
    company: "Viz.Al, Inc."
    product_code: QAS
    year: 2018
    decision: not_oncology
    evidence: >-
      Product code QAS, 21 CFR 892.2080: "Radiological computer-assisted triage and notification
      software ... intended to aid in prioritization and triage of TIME SENSITIVE patient
      detection and diagnosis", and which "does not provide information from the image analysis
      other than triage and notification". The regulation scopes this code to acute, time-critical
      findings; cancer detection is not a time-sensitive triage indication and no QAS device in
      this snapshot carries a cancer claim. Viz.ai ContaCT - the De Novo that created this code;
      large vessel occlusion (LVO) stroke triage.
