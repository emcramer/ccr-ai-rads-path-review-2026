# Group A adjudication fragment: the fourteen generic product codes MYN, QAS, OWB, IYO, QJU, KPR,
# JAA, QTZ, MQB, NQQ, OUO, OXO, LDK and IZL, restricted to rows whose FDA panel is Radiology or
# Pathology - 180 devices in the 2026-03-30 snapshot. Each row was adjudicated individually from,
# in order of preference, its own FDA indications-for-use statement where I could retrieve it, the
# product code's openFDA regulation definition, and knowledge of the named commercial product;
# where I relied on the last of these the evidence field says "Known product:" first. Two findings
# drive the result. First, MYN is confirmed as the pre-2020 catch-all that hides radiology's real
# oncologic origin: it holds the 1998 M1000 ImageChecker, the 2001 RapidScreen RS-2000 and the 2002
# SecondLook, so cancer-directed radiology AI begins in 1998, not 2016. Second, MYN is genuinely
# mixed rather than uniformly oncologic - its 1998 cohort also contains the Logicon Caries Detector,
# and two devices literally named "Lung-CAD" turn out on their FDA indications to detect interstitial
# thickening and lung hyperinflation rather than nodules, so the name is not sufficient evidence
# either way. QTZ is resolved as liver-TUMOUR ablation and moves from indeterminate to oncology.
# Counts: 14 oncology, 162 not_oncology, 4 unresolved
# (11 radiology_cancer_detection, 3 radiology_radiation_therapy, 0 pathology).
version: 1
codes: [MYN, QAS, OWB, IYO, QJU, KPR, JAA, QTZ, MQB, NQQ, OUO, OXO, LDK, IZL]
n_devices: 180
