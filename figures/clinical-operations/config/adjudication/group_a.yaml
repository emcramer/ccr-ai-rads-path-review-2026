    product_code: MYN
    year: 1998
    decision: not_oncology
    evidence: >-
      Known product: Logicon Caries Detector (Carestream Dental), a neural-network aid for
      detecting interproximal dental caries on bitewing radiographs. PMA P980025, 1998. Dental
      caries, not cancer. Notable as a 1998 MYN authorization that is NOT oncologic - MYN's
      pre-2020 content is mixed, not uniformly cancer.
