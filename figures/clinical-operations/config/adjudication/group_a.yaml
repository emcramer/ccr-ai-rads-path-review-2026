  - submission_number: P970058
    device: "M1000 IMAGECHECKER"
    company: "Hologic, Inc."
    product_code: MYN
    year: 1998
    decision: oncology
    category: radiology_cancer_detection
    confidence: high
    evidence: >-
      Known product: R2 Technology's ImageChecker M1000, the first FDA-approved computer-aided
      detection system for screening mammography (PMA P970058, 1998; the PMA now sits with
      Hologic). Cancer detection is the entire purpose of the device. This is the single most
      important misclassification in the code-level rule: it is authorized under generic MYN
      because no cancer-specific radiology product code existed in 1998.
  - submission_number: P980025
