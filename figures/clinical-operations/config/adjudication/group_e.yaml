# Group E - RE-ADJUDICATION OF THE CODES THAT ALREADY CARRY A CODE-LEVEL VERDICT.
#
# Scope: the 17 codes counted as oncology in config/oncology_codes.yaml (QDQ, POK, OEB, SEZ, OTE,
# QNK, QKB, MUJ, IYE, QPN, SFH, QKQ, QYV, PZM, PQP, MNM, NMN; 154 devices) and the 11 codes excluded
# there as not-oncology (QFM, QBS, QWO, SAO, KGI, QHA, PCS, QVD, SGH, SHE, NFJ; 64 devices), all
# restricted to Panel (Lead) of Radiology or Pathology. 218 rows, each adjudicated on its own merits
# with the code-level verdict treated as a prior rather than an answer. The prior fails in BOTH
# directions. POK, admitted on its device-type NAME ("...Lesions Suspicious For Cancer") when its
# actual openFDA DEFINITION says only "assist users in characterizing lesions identified on acquired
# medical images", contains 14 devices that are stroke (6), cardiac (4) or obstetric (4) and only 7
# that are oncologic. QFM, excluded wholesale, contains 6 mammography triage devices, not the 1 the
# config documents. The two OTE mammography PMA supplements are acquisition hardware and fall to the
# brief's hardware rule. QKQ's INFINITT DPS is a whole-slide VIEWER with no cancer-specific function
# and falls to the brief's PACS/workflow rule, contradicting the config's thesis-driven inclusion -
# flagged, not resolved. QDQ (32/32), OEB (9/9), QKB+MUJ+IYE (79/79 radiation therapy) and the
# pathology codes other than QKQ all survive device-by-device review intact, and the two 1995 Pap
# screeners (PAPNET P940029, AUTOPAP P950009) are confirmed as cervical cytology screeners with the
# NMN override still necessary.
#
# RESULT: 143 oncology, 67 not_oncology, 8 unresolved.
# By category: radiology_cancer_detection 56, radiology_radiation_therapy 79, pathology 8.
# Versus the code-level verdict for these same 218 rows (154 counted / 64 excluded), the net change is
# -14 POK, -2 OTE, -1 QKQ, +6 QFM = 143 counted: radiology_cancer_detection 66 -> 56,
# radiology_radiation_therapy 79 -> 79, pathology 9 -> 8. Two further scope flags that are raised but
# NOT acted on: PZM and PQP are NGS sequencing assays inside a figure arguing about imaging AI
# (removing them would take pathology to 6), and P200003 Imagio is counted against the hardware rule
# on the grounds that its only cleared output is a benign-versus-malignant determination.

