# Group D adjudication: product codes IYN, LNH and KPS - 240 devices, all on FDA's
# Radiology panel (no Pathology rows fall in these codes). These three codes are
# imaging-SYSTEM codes, not analysis-software codes: IYN is pulsed Doppler ultrasound
# (116 rows), LNH is MRI (99 rows), KPS is emission computed tomography (25 rows). The
# approach was therefore deliberately strict in the direction the brief warns about:
# modality is never evidence of a cancer indication, so a scanner, a reconstruction
# engine or an acquisition-automation package is not_oncology even where the modality
# (breast ultrasound, prostate MRI, FDG-PET) is overwhelmingly used in oncology. Every
# row was read for a device name that states a neoplastic target - tumour, lesion,
# nodule, mets, prostate/PI-RADS, breast cancer - and none does. The named non-scanner
# tools that do exist here are obstetric (Sonio Detect, FETOLY, BioticsAI, DEEPECHO,
# Butterfly Gestational Age Tool, Clarius OB AI), cardiac (Vivid, Kosmos, Ventripoint,
# RTHawk), hepatic-steatosis and body-composition quantification (LiverMultiScan,
# HepaFat, Hepatica, AMRA Profiler, Prenuvo Body Composition, MuscleView), nerve
# localisation (SonoVision), or deep-learning reconstruction (AIR Recon DL, Sonic DL,
# AiCE, SubtlePET, HYPER DLR, HYPER AiR, Precision DL). Result: 0 oncology, 239
# not_oncology, 1 unresolved. The single unresolved row is IB NEURO (K080762, 2008),
# the only pre-2016 row in these codes: a DSC-MR perfusion rCBV package from a
# neuro-oncology vendor whose cleared indication is nonetheless generic perfusion
# mapping, used for stroke as well as glioma. Two caveats are recorded rather than
# silently resolved: (1) several general-purpose ultrasound platforms here (Samsung
# V/H/RS85 series, GE LOGIQ, Philips EPIQ/Affiniti, Canon Aplio, Siemens ACUSON) can
# be configured with breast/thyroid lesion-characterisation packages such as S-Detect
# or Breast Assistant, which are cleared separately under the cancer-specific codes -
# the FDA row names only the scanner and does not say which AI feature earned the
# listing, so the scanner is not counted; (2) Hepatica performs liver volumetry used
# pre-hepatectomy, but its cleared function is whole-liver quantification, not lesion
# detection. Codes IYN, LNH and KPS therefore contribute nothing to the cancer-directed
# count, which is itself a useful finding: the generic-code undercount the brief is
# chasing does not live in the scanner codes.
