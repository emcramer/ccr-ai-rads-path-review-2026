# Term dictionary for the four review themes.
# Schema: config/README.md. Validation and counts: docs/search-strategy.md.
#
# Matcher contract (measured against PubMed records, 2026-09-01):
#   kind: phrase — case-insensitive, whitespace-tolerant, word-bounded literal.
#   kind: regex  — Python `re`, applied CASE-SENSITIVELY. Write `(?i)` at
#                  position 0 of the pattern to opt into case-insensitivity.
#                  Python rejects `(?i)` anywhere else, so a pattern needs at
#                  most one, at the front.
# Matched against title + " \n " + abstract. Classification is multi-label.
#
# VERSION RULE: bump `version` on ANY content change, not only on changes you
# judge significant. A corrected number in a `notes:` block is a content change —
# it moves the file's SHA, and a run manifest that records the old SHA under the
# same version is then a lie. This is easy to remember when a pattern changes and
# easy to forget when only prose changes; the prose case is the one that has
# caught this project THREE times (modalities v2, themes v7, themes v9).
#
# THE RULE IS NOW ENFORCED, not remembered: config/VERSIONS.json is an
# append-only ledger of version -> SHA-256, and a test fails if this file's hash
# does not match its recorded version, or if a version is reused with a different
# hash. If that test fails after you edit here, the fix is to bump `version` and
# add the new hash to the ledger — never to edit an existing ledger entry.
version: 12

categories:

  foundation_models:
    label: "Foundation Models"
    type: null
    include:
      - pattern: "(?i)\\bfoundation models?\\b"
        kind: regex
      - pattern: "(?i)\\bvision[- ]language models?\\b"
        kind: regex
      - pattern: "(?i)\\blarge (language|vision|multi-?modal(ity)?) models?\\b"
        kind: regex
      - pattern: "\\b(LLM|VLM|MLLM)s?\\b"
        kind: regex
      - pattern: "(?i)\\bChatGPT\\b"
        kind: regex
      - pattern: "\\bGPT-?[0-9]"
        kind: regex
      - pattern: "(?i)\\b(Gemini|Claude|LLaMA|Mistral|Qwen|DeepSeek)[- ][0-9]"
        kind: regex
      - pattern: "(?i)\\bpre-?trained on .{0,40}\\b(million|billion|slides|images)\\b"
        kind: regex
      - pattern: "(?i)\\b(pathology|radiology|medical|clinical) foundation model"
        kind: regex
      # Named pathology and radiology foundation models. All-caps names are
      # matched case-sensitively so they do not collide with ordinary words
      # ("chief", "titan", "prism", "atlas", "uni-", "conch").
      - pattern: "\\b(UNI|CONCH|TITAN|CHIEF|PLIP|KRONOS|MUSK)\\b"
        kind: regex
      - pattern: "(?i)\\b(Virchow|Prov-?GigaPath|GigaPath|Phikon|RudolfV|Hibou|H-optimus|Paige ?PanCancer)\\b"
        kind: regex
      - pattern: "(?i)\\b(CT-FM|RAD-DINO|Merlin|BiomedCLIP|MedCLIP|MedSAM|BiomedGPT|LLaVA-?Med)\\b"
        kind: regex
      - pattern: "(?i)\\bsegment anything\\b"
        kind: regex
    exclude: []
    notes: >
      v3 (2026-09-02) — REBUILT after blind validation measured this category at
      59% precision (27 of 46), with 12 of its 19 false positives from ONE pattern.
      "self-supervised (learning|pre-training|model)" is REMOVED. Self-supervised
      learning is a training technique, not a foundation model: a paper that
      pretrains a small CNN self-supervised is not thereby a foundation model.
      Measured on 3,000 records: it added 13 records beyond the rest of the
      category, and they are ordinary SSL applications — a bpMRI pretraining
      scheme, self-supervised cervical OCT, SSL kidney-tumour classification. A
      QUALIFIED form requiring foundation-model or large-scale-pretraining language
      nearby was also built and measured: it added exactly ONE record, itself
      doubtful, so it is not shipped either.
      "zero-shot" and "few-shot" are REMOVED for the same definitional reason.
      THIS GOES BEYOND THE REPORTED DEFECT and is flagged for the fresh validation
      round: they are evaluation regimes characteristic of foundation models but
      not exclusive to them, and they added 3 and 4 unique records respectively,
      mostly not foundation models (a Fourier neural operator, a radiomics
      delineation model, a few-shot prostate detector).
      Two acronym collisions removed, the same class as CT/PET/IHC. "LMM" matched
      "linear mixed-effects models": 6 corpus records, only 2 genuine. Those 2 are
      preserved because the spelled-out pattern was broadened to
      "large (language|vision|multi-modal(ity)) models?", which catches "large
      multimodality model" — so dropping the acronym costs nothing, verified.
      "PRISM" matched CTRP/PRISM drug-screen compounds, GraphPad Prism, PRISm
      (preserved-ratio impaired spirometry) and bibliometrics software: 24 corpus
      records, and a 12-record read found NO instance of the Paige PRISM pathology
      model. Removed outright.
      Cost of the three removals: 108 records to 89 in a 3,000-record sample,
      roughly 1,610 to 1,320 in the corpus.
      "foundation model" as a phrase, never bare "foundation": in this corpus
      "foundation" alone fires on funding bodies (National Natural Science
      Foundation, National Science Foundation). Measured on a 3,000-record
      sample: 52 records contain "foundation", only 22 contain "foundation
      model". Large language models are treated as foundation models, since the
      review's usage covers both. Named models are listed because most papers
      name the model without ever writing "foundation model"; the all-caps names
      are case-sensitive because the lower-case words collide badly. Deliberately
      misses: papers that describe self-supervised pretraining at scale without
      using any of these words, and models named after this dictionary was frozen.

  multimodal_integration:
    label: "Multimodal Integration"
    type: null
    include:
      - pattern: "(?i)\\bmulti[- ]?modal"
        kind: regex
      - pattern: "(?i)\\bcross[- ]?modal"
        kind: regex
      - pattern: "(?i)\\bmulti[- ]?omics?\\b"
        kind: regex
      - pattern: "(?i)\\bradiogenomic"
        kind: regex
      - pattern: "(?i)\\bradiopathomic"
        kind: regex
      - pattern: "(?i)\\bpathogenomic"
        kind: regex
      - pattern: "(?i)\\bimag(e|ing)[- ](genomic|omic|transcriptomic)"
        kind: regex
      - pattern: "(?i)\\b(data|modality|multimodal|multi-modal|cross-modal|multi-omic) fusion\\b"
        kind: regex
      - pattern: "(?i)^(?=[\\s\\S]*fusion (model|network|framework|strateg))(?=[\\s\\S]*(multi-?modal|cross-?modal|multi-?omic|radiogenomic|pathomic|genomic|clinical (data|feature|variable)))"
        kind: regex
      - pattern: "(?i)\\bintegrat\\w+ (imaging|radiomic\\w*|patholog\\w+|histolog\\w+|clinical) (and|with) "
        kind: regex
      - pattern: "(?i)\\bcombin\\w+ (imaging|radiomic\\w*|patholog\\w+) (and|with) (genomic|transcriptomic|molecular|clinical)"
        kind: regex
      # --- v11: CROSS-MODALITY PREDICTION (author ruling 2026-09-08) ---
      # A model that predicts one modality from another requires both during
      # training, so it is multimodal. Families below mirror the figure's
      # modality ROWS, so 'crossing a family' means crossing a Panel A row.
      # cross-row prediction, molecular readout predicted from an imaging or stain row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)|(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)|(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry)|(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT))"
        kind: regex
      # cross-row prediction, H&E or histology predicted from another row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)|(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)|(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry)|(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT))"
        kind: regex
      # cross-row prediction, IHC predicted from another row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)|(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)|(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)|(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry)|(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT))"
        kind: regex
      # cross-row prediction, spatial transcriptomics predicted from another row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)|(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)|(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry)|(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT))"
        kind: regex
      # cross-row prediction, spatial proteomics predicted from another row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)|(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)|(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)|(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT))"
        kind: regex
      # cross-row prediction, a radiology row predicted from another row
      - pattern: "(?i)\\b(?:predict\\w*|prediction|infer\\w*|inference|generat\\w*|synthes\\w*|estimat\\w*|impute\\w*|translat\\w*|deriv\\w*|reconstruct\\w*|simulat\\w*)\\b[^.]{0,50}\\b(?:CT\\b|computed tomograph\\w+|MRI|MR imaging|magnetic resonance|PET\\b|positron emission|ultrasound|sonograph\\w+|mammogra\\w+|radiograph\\w+|X-?ray|CBCT|SPECT)[^.]{0,50}\\b(?:from|using|based on|out of|given)\\b[^.]{0,50}\\b(?:(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics)|(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathomic\\w*|tissue section\\w*|cytolog\\w+|morpholog\\w+)|(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial omics)|(?:spatial proteom\\w+|protein multiplex\\w*|imaging mass cytometry))"
        kind: regex
      # row-to-row translation, e.g. H&E-to-IHC or MRI-to-CT
      - pattern: "(?i)\\b(?:H&E|h(?:a)?ematoxylin|histolog\\w+|histopatholog\\w+|MRI|magnetic resonance|CT|CBCT)[- ]to[- ](?:IHC|immunohistochem\\w+|immunofluorescen\\w+|multiplex\\w*|H&E|h(?:a)?ematoxylin|histolog\\w+|CT|MRI|PET)\\b"
        kind: regex
      # virtual or synthetic staining: needs H&E plus the target stain during training
      - pattern: "(?i)\\b(?:virtual|synthetic|computational|in[- ]silico|AI[- ]generated|deep[- ]learning[- ]generated)\\w*[\\s-]{0,2}(?:stain\\w*|immunostain\\w*|IHC\\b|immunohistochem\\w+|immunofluorescen\\w+|multiplex\\w*)"
        kind: regex
      # stain transfer with a molecular or IHC target
      - pattern: "(?i)\\bstain (?:transfer|translation|transformation)[^.]{0,60}\\b(?:(?:IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex(?:ed)?\\s*(?:immuno|protein|stain)\\w*|cytokeratin|p16\\b)|(?:gene expression|transcriptom\\w+|genomic\\w*|gene mutation\\w*|mutation status|mutational burden|methylation|RNA-?seq|molecular subtyp\\w+|molecular feature\\w*|molecular marker\\w*|HER2|Ki-?67|PD-L1|copy[- ]number|MSI\\b|microsatellite instabilit\\w+|homologous recombination deficiency|HRD\\b|gene signature\\w*|omics))"
        kind: regex
    exclude:
      - pattern: "(?i)\\bmulti[- ]?modal(ity)? (therap|treatment|analgesi|pain|prehabilitat|rehabilitat|chemotherap|regimen)"
        kind: regex
      - pattern: "(?i)^(?:(?=[\\s\\S]*(\\bmulti[- ]?(modal|parametric)\\w*[^.]{0,60}\\b(MRI|magnetic resonance)\\b|\\b(MRI|magnetic resonance)\\b[^.]{0,60}\\bmulti[- ]?(modal|parametric)))|(?=[\\s\\S]*\\b(T1|T1W|T1WI|T1C|T1CE|T1-weighted|T1 weighted)\\b)(?=[\\s\\S]*\\b(T2|T2W|T2WI|T2-weighted|T2 weighted|FLAIR|DWI|ADC|DCE|DKI|SWI|PWI|MRCP)\\b))(?![\\s\\S]*(cross-?modal|multi-?omic|radiogenomic|pathogenomic|genomic|transcriptom|sequencing|RNA-?seq|clinical (data|feature|variable|factor|parameter|information|characteristic)|(?-i:\\bEHR\\b)|electronic health|patholog|histolog|H&E|h(a)?ematoxylin|whole[- ]slide|(?-i:\\bWSI\\b)|report|\\btext\\b|(?-i:\\bPET\\b)|(?-i:\\bCT\\b)|computed tomograph|ultrasound|sonograph|mammogra|x-?ray|radiograph|liquid biopsy|ctDNA|(?-i:\\bEEG\\b)|(?-i:\\bECG\\b)|dosimetr|dose[- ](volume|distribution)|endoscop|derm(at)?oscop|\\bwearable|mass spectrom|metabolom|proteom|flow cytometr|microbiome|hyperspectral|optical coherence|(?-i:\\bSPECT\\b)|demographic|laborator))"
        kind: regex
    notes: >
      v12 (2026-09-09) — A PRECISION TIGHTENING WAS ATTEMPTED, MEASURED, AND
      DELIBERATELY NOT SHIPPED. Recorded here so nobody repeats it.
      The author found the contradiction: papers carrying this theme with only one
      modality row. Of 3,886 primary-research multimodal papers, 1,368 (35%) had
      fewer than two rows. Five language families were proposed as the cause:
      architecture fusion (multi-scale, multi-view, multi-branch, feature fusion),
      multi-sequence MRI, contrast phases, the multi-centre/task/label family, and
      radiomics-plus-nomogram wording.
      EVERY ONE OF THE FIVE IS COMMONER IN THE GENUINELY MULTIMODAL POPULATION THAN
      IN THE BROKEN ONE. Papers with <2 rows versus papers with >=2 rows:
      radiomics+nomogram 11 vs 137 (12.5 genuine lost per spurious removed);
      contrast phases 120 vs 359 (3.0); multi-sequence MRI 145 vs 357 (2.5);
      multi-centre family 188 vs 420 (2.2); architecture fusion 185 vs 203 (1.1).
      Excluding any of them destroys more than it repairs.
      Even the most targeted form fails: "multimodal" immediately followed by ONE
      modality name — "multimodal MRI", the intra-modality case this theme has
      tried to exclude twice — sits at 150 versus 141, a ratio of 0.94. It does not
      discriminate, because a paper genuinely combining multimodal MRI WITH clinical
      data says exactly the same words.
      THE REASON IS STRUCTURAL. The five families are ubiquitous features of
      radiology papers, not markers of the defect. Prevalence in the broken set was
      mistaken for discriminative power; the ratio against the genuine set is the
      measure that matters, and by it none of them discriminates.
      SO THE INVARIANT IS THE RIGHT MECHANISM, not a pattern. A paper cannot carry
      this theme with fewer than two modality rows; that test uses the fact no
      language matching can approximate, namely how many rows the paper actually
      has. After the v13 recall fix, 1,253 of 3,886 primary papers (32%) still fall
      below two rows and will lose the theme to the invariant. That loss is
      measured, not silent.
      v11 (2026-09-08) — CROSS-MODALITY PREDICTION NOW COUNTS, on the author's
      ruling: "Multimodal should include any models that predict one modality from
      another. Basically, if it requires two modalities during training, then it is
      a multimodal model/application." THIS IS A RULING, NOT A DISCOVERY — the
      author changed the definition after being shown that `genomics` and `ihc`
      treated the same paper in opposite ways. The operative test is REQUIRED DURING
      TRAINING, not consumed as input.
      DESIGN: nine patterns. Six are one-per-TARGET cross-row prediction rules; the
      families they cross are the figure's own MODALITY ROWS, so "crossing a family"
      means crossing a Panel A row. That detail is load-bearing: an earlier draft
      lumped H&E and IHC into one "pathology" family, which made H&E-to-IHC read as
      intra-modality and wrongly excluded exactly the papers the ruling is about.
      The remaining three cover row-to-row translation, virtual or synthetic
      staining, and stain transfer with a molecular target.
      MEASURED: multimodal_integration 4,656 -> 5,133, adding 477 papers. A
      precision read of 20 newly added gave roughly 17 or 18 genuine.
      THE TWO BOUNDARIES THE AUTHOR NAMED WERE MEASURED, NOT ASSUMED:
        * A CLINICAL OUTCOME IS NOT A MODALITY. Predicting survival, recurrence or
          treatment response from CT needs imaging plus an outcome label, not two
          modalities. The design defends against this by WHITELISTING modality
          targets rather than blacklisting outcomes, so an outcome simply cannot
          fill the target slot. Measured: 8.2% of the newly added papers contain
          outcome-prediction language against a corpus base rate of 11.2% — the
          additions are LESS outcome-heavy than the corpus, so the prognostic
          literature was not swept in.
        * SEGMENTATION AND REGISTRATION TARGETS ARE NOT MODALITIES. Same defence,
          same result: 0.6% of additions carry segmentation-target language against
          a 1.3% corpus base rate.
      CORRECTNESS CHECK, offered by the coordinator and used as one: nearly all
      virtual-staining papers should become multimodal, since predicting spatial
      signal from H&E requires both. Measured 12 of 65 before, 61 of 65 after (94%).
      The first draft of these patterns reached only 37 of 65 and the shortfall is
      what exposed the family-design bug above.
      WHAT WAS NOT SHIPPED, on measurement: 15 of the 30 possible cross-row pairs
      matched ZERO corpus records and are not written out; a `cross-modal
      predict/translate` pattern matched 29 records but added 0 new, being fully
      subsumed by the existing bare `cross-modal` include; and an
      `image-to-image translation` pattern was tightened to require a cross-row pair
      and then matched nothing, so it was dropped. An earlier untightened version of
      it admitted "image-to-image translation across three standard MRI contrasts",
      which is intra-modality.
      v6 (2026-09-02) — the intra-modality exclusion WIDENED, and its context list
      HARDENED. Round three measured the v4/v5 form at 55% precision (34-74%)
      against 67% before, with overlapping intervals - it demonstrated nothing.
      The mechanism was measured: the sequence-pair test needs both a T1-family and
      a T2-family term, but only 245 of 3,452 multimodal candidates (7.1%) name
      both, so it fired on 2.4%. The type specimen it missed is PMID 42135350,
      "multi-modal MRI scans" over four BraTS sequences with no other data type and
      not one sequence named.
      The exclusion now has TWO routes: "multi-modal" or "multi-parametric" within
      60 characters of MRI or magnetic resonance (either order), OR the original
      sequence-pair test. Verified: PMID 42135350 is caught by the new route and
      was not caught before. Measured on multimodal candidates in a 3,000-record
      sample, the exclusion rate goes 1.7% -> 5.5% and the theme count 287 -> 276.
      All 11 newly excluded records were read and all 11 are intra-modality MRI
      work - multimodal brain-tumour segmentation from MRI scans, T2w-and-DWI
      registration, multi-parametric MRI segmentation.
      THE LATENT DEFECT IN THE CONTEXT LIST, checked before acting rather than
      assumed. The report named "SPECT" and "CT\\b" as unprotected against
      case-insensitive matching. As written in the file they were already anchored
      as "\\bSPECT\\b" and "\\bCT\\b", and measurement confirms case-insensitivity
      cost 0 and 1 records respectively out of 3,000; the quoted 51% and 64% rates
      reproduce exactly only if the leading word boundary is dropped, which is what
      must have been tested. So that specific defect was not live and is not live
      now. But a REAL unbounded token was present and unreported: "text", which
      matches "context" (169 records) and "texture" (177) - and "texture" is
      everywhere in a radiomics corpus. It is now "\\btext\\b". Every acronym in the
      list is additionally pinned case-sensitive with a scoped flag,
      "(?-i:\\bCT\\b)" and so on, so that widening the exclusion cannot make the
      class live later.
      v4 (2026-09-02) — the intra-modality exclusion REWRITTEN after round two
      showed the v3 version did not work: precision moved only 64% to 67% with
      overlapping intervals, and 11 of 21 remaining false positives were still
      intra-modality fusion. The v3 exclude required the literal phrase "multimodal
      MRI", so it missed "multi-modal deep learning ... magnetic resonance imaging
      sequences" and could not fire at all when MRI was never named.
      It now keys on SEQUENCE NAMES instead of phrase order: it fires when a T1
      family term and a second sequence family term (T2, FLAIR, DWI, ADC, DCE, SWI,
      PWI, MRCP) both appear and NO other data type is named anywhere in the
      record. Phrase order is irrelevant and the word "MRI" need never appear.
      MEASURED: fires on 5 records per 3,000 against the old version's 2, and all
      5 read are genuinely intra-MRI — radiomics across T1 and T2 sequences,
      MRI synthesis, perfusion-weighted radiomics, sequence-limited segmentation.
      "early|late|intermediate fusion" REMOVED from the fusion alternation as
      commonly architectural. Measured cost: 3 matches in 3,000, only 1 unique to
      those words, so the removal is close to free.
      NOT ADDRESSED, deliberately: the CT analogue (multi-phase CT fusion) matched
      3 records in 3,000, too few to justify a pattern.
      v3 (2026-09-02) — two fixes from blind validation. The FUSION patterns were
      firing on network architecture: "Spatial Feature Fusion Convolutional
      Network" is a model-internal operation, not multimodal data. "feature
      fusion" and "image fusion" are REMOVED from the first pattern — measured at
      53 of its 60 matches — leaving the multimodal terms of art (data, modality,
      late, early, intermediate, cross-modal, multi-omic). The second pattern,
      "fusion model/network/framework", is now CONJUNCTIVE: it requires multimodal,
      cross-modal, multi-omic, radiogenomic, pathomic, genomic or clinical-data
      language elsewhere in the record. That took it from 54 matches to 27.
      The MULTIPARAMETRIC-MRI exclusion is deliberately context-aware, not blunt.
      A blunt exclude on "multimodal MRI" would fire on 18 records in 3,000, but 6
      of those genuinely pair MRI with another data type. The shipped exclude fires
      only when "multimodal MRI" appears AND no other data type is named anywhere
      in the record: 2 records in 3,000, both genuinely MRI-sequence-only.
      Building it required adding liquid biopsy and EEG to the context list,
      because the first draft wrongly excluded an MRI-plus-liquid-biopsy paper and
      an MRI-EEG digital-twin paper. Both excludes are record-level.
      "multimodal" in oncology also means multimodal *therapy* (surgery plus
      chemotherapy plus radiation) and multimodal analgesia. Within this corpus
      that sense is uncommon — 2 of 18 sampled "multimodal" records — because the
      corpus already requires an AI term, so the exclude list is short and
      targeted at the therapy sense only. The exclude is record-level: a paper
      that genuinely fuses modalities *and* mentions multimodal therapy loses the
      theme label. Measured at 7 records per 3,000, so the cost is small and it is
      preferred to the alternative of admitting therapy papers. Deliberately
      misses: papers that fuse image and text without ever calling it multimodal.

  digital_twins:
    label: "Digital Twins"
    type: null
    # STANDARD CHANGE 2026-09-02 (author): this row tracks trends of INTEREST in
    # the literature, not successful construction of a digital twin. Papers that
    # engage with the idea in any capacity count — proposing a framework, building
    # a component, reviewing it, or naming it as future work.
    #
    # OPERATIONAL LINE (approved 2026-09-02): the paper must INVOKE THE
    # DIGITAL-TWIN IDEA ITSELF, IN THE TWIN VOCABULARY — not merely supply
    # something a twin would need. Without this line "a building block for one"
    # has no stopping point: every longitudinal imaging study is a building block
    # and the theme swallows the corpus.
    include:
      - pattern: "(?i)\\bdigital[\\s-]+twin(s|ning)?\\b"
        kind: regex
    exclude: []
    notes: >
      v5 (2026-09-02) — ONE PATTERN, and that is the finding. Measurement says the
      twin vocabulary in this corpus is saturated by "digital twin" alone.
      The pattern tolerates a hyphen: "(?i)\\bdigital[\\s-]+twin(s|ning)?\\b". This was
      not cosmetic. A literal space missed "modeling digital-twin of renal
      functions", one real paper, and the fix took the corpus count from 55 to 56 —
      which is exactly the figure the hand screen expects from the current
      vocabulary. "digital twinning" measures 0 corpus records but costs nothing to
      tolerate.
      DO NOT ANCHOR THIS PATTERN ON A MODIFIER. The genuine vocabulary is "digital
      twin" plus a modifier, and the modifiers vary without limit across the
      screened papers — medical, clinical, cognitive, theranostic, generative,
      optical, geometric, therapeutic. Because every modifier PRECEDES the head
      noun, the unanchored pattern catches them all; any refinement that requires a
      known modifier would silently lose the rest.
      COLLISIONS, all seven now handled. Five died in v4 with the removal of
      "digital (patient|tumour|avatar)": the CamelCase acronym "DiGital tuMor
      pArameTErs", "Digi-TAS", "DGMate", "digital patient files", and "digital
      tumor signatures" (autoencoder latents). Verified absent from the 115-record
      candidate population. The sixth, "patient avatars?", is REMOVED here: it
      matched exactly ONE record in the entire corpus, and that record displays CNN
      heatmaps on 3D total-body-photography avatars — a photograph, not a model.
      Zero genuine papers lost; the same free-removal result as MIBI in v4. That
      also disposes of the VR surgical-avatar case. No guard was written against
      "digital tumour signatures" and none is needed, so genuine "digital twin of
      the tumour" phrasing is untouched.
      RECALL: the ranked candidate list was measured against the whole corpus and
      EVERY TERM YIELDED ZERO papers that pass the operational line.
        * "patient-specific computational model" — 1 corpus record, 0 unique. It is
          the neuro-oncology systematic review that also says "digital twin" in its
          title. The field's reviewers do treat these as one literature, but in
          this corpus the phrase never appears outside a paper already captured.
        * "virtual human twin" — the EU term of art, and genuine twin vocabulary,
          but 0 unique. Its one appearance is the sentence "'Digital twins', also
          called 'digital patient twins' or 'virtual human twins'", where the head
          term sits three words away. This is the failure mode predicted for
          "virtual replica", and "virtual replica" measured 0 records outright.
        * "in silico trial" (3 unique) and "virtual trial" (2 unique) — REJECTED on
          the operational line. Every one is a virtual IMAGING trial simulating the
          scanner chain over phantoms; none reaches for the twin idea.
        * "virtual cohort" (1 unique) and bare "virtual patient" (9 unique) —
          REJECTED on the operational line. Phantoms, XCAT human models and GAN
          synthetic-data augmentation. Confirms the screener's warning that
          precision might improve while yield stayed negligible.
        * "digital <modifier> twin" as a construction — 0 unique.
      SELF-CORRECTION: an earlier v5 draft added "digital patient/human model",
      "virtual patient model" and "patient-specific simulation/computational
      model", gaining 5 records. All five were then tested against the operational
      line and ALL FIVE FAILED — none contains any twin vocabulary. They are a
      biobank's patient model, an image-registration coordinate space, two 3D
      surgical-planning models and a finite-element tumour-growth simulation:
      exactly the "supplies what a twin needs but never invokes it" class the line
      exists to exclude. The additions were reverted.
      ONE DISAGREEMENT WITH THE HAND SCREEN, surfaced rather than resolved: the
      screener counts the "Twin-GRU" paper as a collision because its authors
      disclaim the twin sense. It is the only Twin-GRU record in the corpus and its
      TITLE reads "A Digital Twin-Inspired Closed-Loop Latent Simulation
      Framework". Under the strict standard it is a false positive; under
      "engagement with the idea in any capacity" a title framing the work as
      digital-twin-inspired is engagement, and it is currently counted. No pattern
      separates it from genuine usage — if the screener's reading governs, it must
      be dropped by PMID.

  clinical_fda:
    label: "Clinical Applications / FDA Approval"
    type: null
    # SCOPE DECISION 2026-09-01 (author): this theme means REGULATORY CLEARANCE
    # ONLY. The earlier draft ORed in clinical-deployment language and measured
    # ~3,290 papers; that reading was rejected. A pathology line of a handful of
    # papers per year IS the review's argument, since pathology has almost no
    # cleared AI against radiology's ~1,100 devices.
    include:
      # --- Group A: specific regulatory instruments. Unconditional; each one
      # names a regulator or a statutory pathway, so none of them can mean
      # anything else.
      - pattern: "\\b510\\(k\\)"
        kind: regex
      - pattern: "(?i)\\bCE[- ]mark"
        kind: regex
      - pattern: "(?i)\\bpre-?market (approval|notification|clearance)"
        kind: regex
      - pattern: "(?i)\\bsoftware as a medical device"
        kind: regex
      - pattern: "\\bSaMD\\b"
        kind: regex
      - pattern: "(?i)\\b(medical )?devices? (clearance|approval|authoriz)"
        kind: regex
      - pattern: "(?i)\\bAI[- ]enabled (medical )?device"
        kind: regex
      - pattern: "\\b(MHRA|PMDA|NMPA|UKCA)\\b"
        kind: regex
      # --- Group B: "FDA" and "regulatory approval" are generic and leak badly
      # on their own, so each is constrained. The FDA patterns require a
      # software/device noun within 90 characters and no intervening sentence
      # break; the "regulatory approval" pattern requires a possession verb, so
      # that "further validation and regulatory approval are needed" does not
      # match.
      - pattern: "(?i)\\b(FDA|Food and Drug Administration)[- ]?(clear\\w*|approv\\w*|authoriz\\w*|grant\\w*)\\b[^.]{0,90}\\b(algorithm|software|artificial intelligence|deep learning|machine learning|device|tool|system|CADx|CADe|application|platform|assistant|solution|product|AI)\\b"
        kind: regex
      - pattern: "(?i)\\b(algorithm|software|artificial intelligence|deep learning|machine learning|device|tool|system|CADx|CADe|application|platform|assistant|solution|product|AI)\\b[^.]{0,90}\\b(FDA|Food and Drug Administration)[- ]?(clear\\w*|approv\\w*|authoriz\\w*)\\b"
        kind: regex
      - pattern: "(?i)\\b(clear\\w*|approv\\w*|authoriz\\w*) by the (US |U\\.S\\. )?(FDA|Food and Drug)\\b"
        kind: regex
      - pattern: "(?i)\\b(received|receives|obtained|granted|gained|gains|has|have|holds?|awarded|carries|achieved|secured)\\s+((the|a|an|multiple|numerous|several|its|their|full|initial|already)\\s+){0,3}regulatory (approval|clearance|authoriz)"
        kind: regex
    exclude:
      # The one systematic false-positive class: approval of a DRUG or
      # RADIOTRACER rather than of an AI device. Both patterns were measured
      # against all 97 pre-exclusion matches and removed 4 false positives with
      # ZERO genuine records lost.
      - pattern: "(?i)\\b(approv\\w+|clear\\w+|authoriz\\w+)\\b[^.]{0,50}\\b(monotherapy|chemotherap\\w+|immunotherap\\w+|radioligand|radiopharmaceutic\\w+|radiotracer|inhibitor|antibod\\w+|therapeutic agent|as a treatment|for the treatment of)\\b"
        kind: regex
      - pattern: "(?i)\\b(\\[?1?\\d{2,3}\\s?[A-Za-z]{1,2}\\]?[- ]?(Lu|Ga|F|Tc|Cu|Zr)|Lu-PSMA|PSMA-617|PSMA-11|fluoroestradiol|piflufolastat|DCFPyL)\\b[^.]{0,70}\\b(approv|regulatory approval)"
        kind: regex
    notes: >
      v4 (2026-09-02): "following" dropped from the possession verbs of the
      "regulatory approval" pattern. It admitted temporal sequence — "following
      regulatory approval, 123 examinations were reviewed" — rather than possession
      of a clearance by the thing being studied.
      Regulatory clearance only, per the author's decision of 2026-09-01.
      Measured by downloading ALL 834 corpus records containing any regulatory
      vocabulary and running these patterns over the full set, not over a sample:
      93 records match, and reading all 93 gives 95.7% precision (4 residual false
      positives). Bare "FDA" is never used; it appears in discussion sections of
      papers that cleared nothing. Bare "regulatory approval" was measured at 44%
      precision over 16 reads — nine of sixteen were aspirational, of the form
      "further validation and regulatory approval are needed" — and is not
      shipped; only the possession-constrained form is. The four residual false
      positives are drug or biomarker approvals discussed inside genuine AI
      imaging papers, which no pattern separates without losing true positives.
      Counts are small and the per-year series is thin before 2023: see
      docs/search-strategy.md for the year-by-year and radiology/pathology split
      and for the recommendation to plot it cumulatively.
      #
      # ---------------------------------------------------------------------
      # PRESERVED, DELIBERATELY NOT USED: clinical-deployment vocabulary.
      # This is the ~3,290-paper reading of the theme that the author rejected on
      # 2026-09-01. It is kept verbatim so that a reversal does not require
      # rediscovering and re-validating the terms. To restore, move these back
      # into `include` and re-measure; they were NOT precision-read individually.
      #
      #   - pattern: "(?i)\\bclinical (deployment|implementation|integration|workflow|adoption|readiness|translation)\\b"
      #     kind: regex          # measured 105 / 3,000 sample
      #   - pattern: "(?i)\\bprospective(ly)? (multicent|valid|evaluat|random|recruit|enroll)"
      #     kind: regex          # measured  57 / 3,000 sample
      #   - pattern: "(?i)\\breal[- ]world (deployment|implementation|setting|evidence|performance)\\b"
      #     kind: regex          # measured   7 / 3,000 sample
      #   - pattern: "(?i)\\broutine (clinical )?(practice|use|care|workflow|diagnostic)\\b"
      #     kind: regex          # measured  31 / 3,000 sample
      #   - pattern: "(?i)\\bcommercial(ly available)?[ -](AI|artificial|software|algorithm|system|tool|deep)"
      #     kind: regex          # measured  19 / 3,000 sample
      #   - pattern: "(?i)\\b(multi[- ]?)?reader stud"
      #     kind: regex          # measured  14 / 3,000 sample
      #   - pattern: "(?i)\\bclinically (deployed|implemented|integrated|validated)\\b"
      #     kind: regex
      #
      # Union of the above with the regulatory group measured 221 / 3,000
      # (~3,290 corpus papers) at roughly 11/14 precision for "is about clinical
      # application" — a different and much weaker claim than "was cleared".
      # ---------------------------------------------------------------------

  virtual_staining:
    label: "Virtual Staining"
    type: null
    # Added v7 (2026-09-02). Author definition, verbatim: "any models that predict
    # spatial proteomics or spatial transcriptomics from H&E stained tissue slides".
    # DIRECTION IS ENFORCED BY REQUIRING A MOLECULAR OR SPATIAL-OMIC TARGET, which is
    # what separates this literature from the large adjacent one going the other way.
    include:
      - pattern: "(?i)\\bvirtual\\w*\\s+(IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)"
        kind: regex
      - pattern: "(?i)\\b(virtual|computational|digital|in[- ]silico|AI[- ]generated|deep[- ]learning[- ]generated)(ly)?[- ]?(stain\\w*|immunostain\\w*)[^.]{0,45}\\b(IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)"
        kind: regex
      - pattern: "(?i)\\b(IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)[^.]{0,45}\\b(virtual|computational|digital|in[- ]silico|AI[- ]generated|deep[- ]learning[- ]generated)(ly)?[- ]?(stain\\w*|immunostain\\w*)"
        kind: regex
      - pattern: "(?i)\\bH&E[- ]?to[- ]?((IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)|mIF|multiplex)"
        kind: regex
      - pattern: "(?i)\\bstain (transfer|translation|transformation)[^.]{0,50}\\b(IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)"
        kind: regex
      - pattern: "(?i)\\b(generat\\w+|synthes\\w+|impute\\w+)[^.]{0,45}\\b(IHC|immunohistochem\\w+|immunostain\\w+|immunofluorescen\\w+|immunolabel\\w+|multiplex\\w*|HER2|Ki-?67|p16\\b|PD-L1|CD\\d{1,3}\\b|cytokeratin|ER/PR|oestrogen receptor|estrogen receptor)[^.]{0,45}\\bfrom\\b[^.]{0,45}\\b(H&E|h(a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathology image\\w*|tissue image\\w*|morpholog\\w+|routine (slide|section|stain))"
        kind: regex
      - pattern: "(?i)\\b(predict\\w*|infer\\w*|generat\\w*|impute\\w*|estimat\\w*|deriv\\w*)[^.]{0,60}\\b(spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial proteom\\w+|spatial omics?|spatial molecular)\\b[^.]{0,60}\\b(from|using|based on|via)\\b[^.]{0,45}\\b(H&E|h(a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathology image\\w*|tissue image\\w*|morpholog\\w+|routine (slide|section|stain))"
        kind: regex
      - pattern: "(?i)\\b(spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial proteom\\w+|spatial omics?|spatial molecular)\\b[^.]{0,45}\\b(prediction|generation|inference|imputation)[^.]{0,45}\\b(from|using|based on|via)\\b[^.]{0,45}\\b(H&E|h(a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathology image\\w*|tissue image\\w*|morpholog\\w+|routine (slide|section|stain))"
        kind: regex
      - pattern: "(?i)\\b(H&E|h(a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathology image\\w*|tissue image\\w*|morpholog\\w+|routine (slide|section|stain))\\b[^.]{0,60}\\b(predict\\w*|infer\\w*|generat\\w*|impute\\w*)[^.]{0,45}\\b(spatial transcriptom\\w+|spatial gene expression|spatially resolved gene expression|spatial proteom\\w+|spatial omics?|spatial molecular)"
        kind: regex
      - pattern: "(?i)\\b(gene expression|transcriptom\\w+) prediction[^.]{0,45}\\b(from|using)\\b[^.]{0,40}\\b(H&E|h(a)?ematoxylin|histolog\\w+|histopatholog\\w+|whole[- ]slide|WSI|pathology image\\w*|tissue image\\w*|morpholog\\w+|routine (slide|section|stain))"
        kind: regex
    exclude: []
    notes: >
      SCOPE RULING (author, 2026-09-02): SPATIAL MAPS ONLY. A HER2 status, a
      PD-L1 score or a Ki-67 positivity call is NOT spatial proteomics, even when
      predicted from an H&E slide. The definition stands as written: the model must
      produce a spatially resolved molecular or protein-level readout. This ruling
      resolved a seven-paper disagreement between two independent reads of the same
      76 papers, and the validator's stricter reading was the correct one.
      THE REPAIR, v8: `predict\w+` was dropped from the verb list of include[5].
      That verb cannot distinguish "GENERATE a virtual HER2 stain from H&E" from
      "PREDICT HER2 status from H&E", and only the first is in scope. Independently
      verified rather than taken on report: the token's removal drops exactly 11
      papers, ALL ELEVEN WERE READ, and all eleven are status, score or expression
      prediction - PD-L1 status, BAP1 IHC expression, HER2 status (x4), Ki-67/ER/PR
      status, PD-L1 expression, IHC biomarkers, IHC markers, HER2 score, and
      KRAS/NRAS/BRAF status. Not one produces a spatial map. ZERO GENUINE PAPERS
      LOST. Two alternative repairs were measured worse by the validator.
      COUNT AND PRECISION. The row is 65 papers. Under the author's ruling,
      precision before the repair was 63 of 76 (82.9%, 95% CI 72.9-89.7) and after
      it is 63 of 65 (96.9%, 95% CI 89.5-99.2).
      THE ROUTE SPLIT IS WHERE THE REAL STRUCTURE IS, and pooling hid it:
        * Route 2, spatial-omic prediction from histology (include[6..9]):
          32 of 32, 100%. Cleanly separable, and untouched by the repair.
        * Route 1, virtual-staining vocabulary (include[0..5]): 31 of 44, 70.5%
          before the repair, and it carried EVERY false positive. After the repair
          it is 31 of 33, 93.9%.
      The two literatures are not merely disjoint in vocabulary: route 2 has no
      adjacent literature to be confused with, while route 1 sits next to a
      biomarker-status-prediction literature it cannot distinguish itself from
      without the verb constraint. That is why one token was worth 14 points.
      DISJOINTNESS IS OBJECTIVE, not impressionistic. Tested on which patterns
      actually fired across all 76: 44 route-1-only, 32 route-2-only, ZERO in both.
      After the repair, 33 and 32 with zero overlap. The
      spatial-transcriptomics-prediction literature never uses the words "virtual
      staining" and the virtual-staining literature never says "spatial
      transcriptomics prediction"; either route alone would have found about half
      the row.
      AN EARLIER NOTE IN THIS FILE SAID 54 PAPERS AT ~91%, "whole population read".
      That was wrong, and the error is recorded because it is a methodological trap
      rather than a typo. The 54 was the set enumerated by hand from a 626-record
      candidate population built by a PubMed term query; the compiled patterns
      generalise beyond the terms that built that query, so they selected 22 papers
      it never retrieved. All 54 proved to be a strict subset of the 76.
      THE LESSON, for anyone extending this file: validate a pattern against the
      CORPUS, never against the candidate query that inspired it. A candidate query
      is a superset of the papers you thought of, not of the papers your regex
      matches.
      THE BOUNDARY, measured on the 626-record candidate population:
        * REVERSE DIRECTION - virtual H&E generated FROM autofluorescence,
          photoacoustic, quantitative-phase or label-free imaging. The largest
          adjacent literature at 77 candidate records, 72 correctly excluded. They
          are excluded STRUCTURALLY, by requiring a molecular target, not by a
          blocklist.
        * STAIN NORMALISATION and colour transfer - 129 candidate records, exactly
          ONE enters, and that one is His-MMDM, a genuine multi-omics
          image-translation paper that also mentions normalisation. No real leak.
        * VIRTUAL SPECIAL STAINS (Masson trichrome, PAS, Jones silver) - settled
          cheaply by measurement: the corpus holds exactly ONE such paper (PMID
          34385460). Excluded; a histochemical stain is not molecular or
          spatial-omic. THE COST IS ONE PAPER.
      WHAT WAS REJECTED: a source-restricted variant requiring an explicit H&E or
      histology token, measured at 52 against 54 on the candidate population. Not
      shipped, because it is false precision - it removes 2 label-free-source
      papers while leaving 3 of the same class that happen to say "histology"
      elsewhere. Requiring a molecular target is the filter that works.
      THE FIVE LABEL-FREE-SOURCE PAPERS STAY (PMIDs 37850170, 39154539, 39636222,
      41676162, 41933080). They predict molecular signal from autofluorescence or
      label-free imaging rather than from H&E, so they match the spirit of the
      definition but not its letter. Two independent reads identified the same five
      and both judged them in; removing them moves precision by about one point. A
      definitional preference, not a quality problem, and the author has not asked
      for them out.
      AGREEMENT WITH THE INPUT-ONLY RULE: of the matched papers only ONE also
      carries `genomics` - PMID 32953248, predicting nuclear BAP1 IHC from H&E,
      where the genomics label comes from a discussion sentence about "genetic
      alterations". That is a `genomics` mention-not-input case, not a boundary
      failure. It is now moot for this row, since the v8 repair drops that paper
      from `virtual_staining` anyway. The `genomics` label on it was left alone
      deliberately: the pattern responsible, genomics include[12], is the SOLE
      trigger for 126 corpus papers, so narrowing it is not free.
      PANEL B: 65 papers. Applying the pipeline's own year assignment to the
      surviving 65 projects 2019 1, 2020 2, 2021 1, 2022 2, 2023 6, 2024 13,
      2025 19, 2026 21 (partial). THAT IS A PROJECTION, NOT A MEASUREMENT - the
      authoritative series is whatever the next classifier run writes to
      theme_year_counts.csv. Do not quote it from here. Note that a naive recount
      from freshly fetched PubMed dates disagrees on 3 of the 65, because the
      pipeline assigns year from ArticleDate and a raw fetch gives PubDate.

  agentic_ai:
    label: "Agentic AI"
    type: null
    # Added v9 (2026-09-03). Author definition: "using an AI agent to do pathology
    # or radiomics research, or clinical application", examples ChatEHR, PathChat,
    # Biomni. The distinguishing feature is PLANNING, TOOL USE, or MULTI-STEP
    # AUTONOMOUS ACTION — not a chat interface and not a single-shot LLM query.
    #
    # BARE `agent` IS UNUSABLE. In an oncology corpus it means a drug: 629 corpus
    # records match bare `agents?`, of which 275 are "contrast agent" and 89 are
    # therapeutic/cytotoxic/antineoplastic agents. Every pattern here is qualified.
    include:
      - pattern: "(?i)\\bagentic"
        kind: regex
      - pattern: "(?i)\\b(AI|A\\.I\\.|LLM|GPT|large language model|language[- ]model|software|autonomous|intelligent|generative)[- ]agents?\\b"
        kind: regex
      - pattern: "(?i)\\bautonomous\\s+(artificial intelligence|AI)\\s+agents?\\b"
        kind: regex
      - pattern: "(?i)\\bmulti[- ]?agents?\\b(?!\\s+(chemotherap|regimen|therap|treatment|cytotoxic|systemic|artificial life))"
        kind: regex
      - pattern: "(?i)\\bagent[- ]based (framework|system|workflow|pipeline|AI|approach|large language)"
        kind: regex
      - pattern: "(?i)\\b(AI|artificial intelligence|generative|clinical|diagnostic|patholog\\w+|dermatolog\\w+|radiolog\\w+|multimodal|surgical|oncolog\\w+)[\\s-][\\w -]{0,24}co[- ]?pilots?\\b"
        kind: regex
      - pattern: "(?i)\\bco[- ]?pilots?\\W{0,3}\\s*(in|for)\\s+(cancer|patholog|radiolog|oncolog|clinical|medical|health|dermatolog|surgical)"
        kind: regex
      - pattern: "(?i)\\b(PathChat|ChatEHR|Biomni)\\b"
        kind: regex
    exclude: []
    notes: >
      35 papers, measured over a 917-record candidate superset built to be a
      PROVABLE superset of anything these patterns can match (every corpus record
      containing agent, agentic, copilot, tool use/calling, autonomous, orchestrat*,
      chain-of-thought, multi-agent, or a named system). That construction is
      deliberate: the previous theme was mis-measured because its candidate query
      was narrower than its patterns.
      PRECISION IS STRONGLY TIME-DEPENDENT, and this is the finding that matters
      for Panel B. Reading all 35:
        * 2025-2026 (n=27): 24 of 27 strictly agentic, 89%.
        * pre-2025 (n=8): 1 of 8 strictly agentic, 12%.
        * whole row: 25 of 35 strict (71%), or 30 of 35 (86%) if classical
          reinforcement-learning agents are counted as agents.
      The word "agent" only acquired its agentic-AI sense around 2025. Before that,
      a match in this corpus is a drug (guarded out), a reinforcement-learning
      agent, or a model whose authors simply called it an agent — a cGAN for IMRT
      planning, a screening interface, a signature-fusion ensemble. NO VOCABULARY
      SEPARATES THOSE: they use the words correctly for their own era. RECOMMENDED
      FOR THE FIGURE: the pre-2025 tail is 8 papers across five years and is mostly
      not agentic AI. Either start the line at 2025 or say in the legend that
      points before 2025 are unreliable. Do not present the early tail as a trend.
      REJECTED, with measurements:
        * CHAIN-OF-THOUGHT — 31 records, the largest reasoning signal in the
          corpus, and NOT SHIPPED. Reading the 28 it would newly admit: roughly 24
          are prompting-strategy benchmarks — "zero-shot, few-shot and
          chain-of-thought prompting were tested", "CoT prompting to classify T1
          versus T2". Chain-of-thought is a PROMPTING TECHNIQUE, not agency: the
          model emits intermediate reasoning tokens in one pass; it does not plan,
          call tools, or act across steps. The author's definition excludes the
          single-shot LLM query explicitly.
          THE DECISION WAS ALSO TESTED EMPIRICALLY, against a prediction recorded
          before the fact: a healthy theme was expected at 35-75 papers with about
          61% `foundation_models` overlap, and the stated signature of failure was
          a much LARGER theme with a HIGHER overlap. Measured: shipped without
          chain-of-thought, 35 papers at 63% overlap. With chain-of-thought added,
          63 papers at 75% overlap — the failure signature exactly. Genuine
          chain-of-thought AGENTS are already caught by the agentic vocabulary
          (Pathology-CoT enters via `agentic`), so the rejection costs little.
        * `tool[- ](use|using|calling)` — 22 records, and 0 OF 22 ARE AGENTIC.
          Every one is "a diagnostic tool using deep learning", "a decision-support
          tool using MRI"; the ML terms of art `tool use`, `tool calling` and
          `tool-augmented` match ZERO corpus records each. All 22 are the ordinary
          English participle. This was the largest single signal term on offer and
          it is entirely spurious.
        * bare `copilot` — 13 records, roughly 4 genuine. The rest are "Microsoft
          Copilot" listed among ChatGPT, Gemini and Perplexity in LLM benchmark
          comparisons: a product name in a list, not a system under study. Only the
          domain-qualified forms are shipped, and the `copilot in/for X` form
          requires X to be a clinical domain, because an unrestricted version
          matched "Copilot in both Italian and English".
        * `orchestrat*` — 33 records, roughly 4 computational. The rest are
          biology: "TUBA1C orchestrates the immunosuppressive tumour
          microenvironment", "signalling orchestrates recruitment".
        * `autonomous <AI noun>` — 24 records, ~2 agentic. In this literature
          "autonomous" almost always means unsupervised DEPLOYMENT (autonomous
          triage, autonomous screening), which is a regulatory property, not
          planning or tool use. Only `autonomous artificial intelligence agent` is
          shipped.
        * `agent[- ]based (model|modelling|simulation)` — NOT shipped. It is a
          simulation technique, and it is adjacent to the digital-twins literature,
          so a leak would corrupt two themes at once. Measured: 2 records, both
          simulation ("informing agent-based models with spatial data",
          "agent-based modeling" beside topological data analysis). The sibling
          form `agent-based (framework|system|workflow|...)` IS shipped and its 2
          records are both genuine agentic systems. The split works.
        * `conversational[- ]agent` — dropped from the qualifier list; the author
          excludes chat interfaces explicitly. Costs 1 record.
        * `multi[- ]agent` — SHIPPED WITH A GUARD. Of 10 records, 2 are
          "multi-agent chemotherapy", which is standard oncology usage for a drug
          combination. The guard removes those 2 and an artificial-life simulation,
          keeping 7.
      KEPT BUT FLAGGED FOR THE AUTHOR: 5 records are classical reinforcement-
      learning or multi-agent-RL work (MARL for ultrasound segmentation, RL for
      procedure planning). They satisfy the definition's "acts across steps" but
      belong to a different technical lineage from the LLM-agent wave the review
      describes. They are counted; excluding them would narrow the author's own
      definition on my judgment, so the decision is surfaced rather than taken.
      THE NAMED EXAMPLES: of the author's three, only PathChat appears in the
      corpus, and only as a MENTION inside two review articles. ChatEHR (2 PubMed
      records) and Biomni (3) exist in PubMed but fall outside the corpus, correctly
      — they are EHR and general-biomedical agents, not cancer imaging.
      MORE IMPORTANTLY, THE PRIMARY PathChat PAPER IS NOT IN THE CORPUS EITHER.
      PMID 38866050, "A multimodal generative AI copilot for human pathology",
      Nature 2024, matches the corpus METHOD and DOMAIN blocks but FAILS THE CANCER
      BLOCK: its abstract contains no cancer term at all, speaking only of
      "pathology", "diverse tissue origins and disease models". This is a corpus
      recall gap, not a theme defect, and it is worth knowing because the paper is
      named in the manuscript. See docs/search-strategy.md section 8.
      FLOOD-RISK CHECK, the one that matters most for this theme. Partitioning the
      629 corpus records containing bare `agents?`: 384 carry a drug or contrast
      cue, 29 carry a software cue, and 216 carry NEITHER. Those 216 are where a
      thirty-paper theme becomes a three-hundred-paper one, and any pattern
      approaching bare `agent` would pull them in. THE SHIPPED PATTERNS SELECT 0 OF
      THE 216. Every pattern is qualified; none approaches the bare token.
      OVERLAP WITH `digital_twins`: 0 of 35. `agent-based model` measures 2 corpus
      records with zero digital-twin co-occurrence, so no defence against it was
      needed and none was built. If a future run shows any agentic_ai by
      digital_twins overlap, it is a leak from some other pattern and should be
      investigated rather than explained away.
      OVERLAP WITH `foundation_models`: 22 of 35 (63%), reported not suppressed.
      That is expected and mostly correct — agentic systems are built on foundation
      models, and a paper describing an LLM agent for pathology is legitimately
      both. The themes are not mutually exclusive by design.
