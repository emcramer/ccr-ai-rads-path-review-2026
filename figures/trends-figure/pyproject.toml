[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccr-trends"
version = "0.1.0"
description = "Literature-trends figure for the CCR review on AI in radiology and pathology"
requires-python = ">=3.12"
dependencies = ["requests", "pandas", "matplotlib", "pyyaml", "lxml", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
